name: npm-ci-diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Pin npm to 10.9.8
        run: npm install -g npm@10.9.8

      - name: Versions
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"

      - name: npm ci against committed lockfile
        run: |
          rm -rf node_modules
          npm ci --no-fund --no-audit

      - name: npm ls affected packages
        continue-on-error: true
        run: npm ls @emnapi/core @emnapi/runtime @emnapi/wasi-threads picomatch --all

      - name: npm test
        run: npm test

      - name: npm run lint
        continue-on-error: true
        run: npm run lint

      - name: npm run build
        run: npm run build
